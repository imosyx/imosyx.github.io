<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Key Manager</title>

<style>
body {
    background: #0f1117;
    color: #e6edf3;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
}

.container {
    background: #161b22;
    padding: 20px;
    border-radius: 10px;
    max-width: 500px;
    margin: auto;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

input, button {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: none;
    border-radius: 6px;
    font-size: 14px;
}

input {
    background: #0d1117;
    color: white;
}

button {
    background: #238636;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #2ea043;
}

pre {
    text-align: left;
    background: #0d1117;
    padding: 10px;
    border-radius: 6px;
    overflow-x: auto;
}
</style>
</head>

<body>

<div id="errorScreen">
    <h2>Error: couldn't fetch</h2>
</div>

<div id="loginScreen" class="container" style="display:none;">
    <h2>Login</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none;">
    <div class="container">
        <h2>Key Manager</h2>

        <h3>Add Key</h3>
        <input id="owner" placeholder="Owner">
        <input id="key" placeholder="Key">
        <input id="expires" type="datetime-local">
        <input id="notes" placeholder="Notes">
        <button onclick="addKey()">Add Key</button>

        <h3>Manage Key</h3>
        <input id="manageId" placeholder="Key ID">
        <button onclick="revokeKey()">Revoke</button>
        <button onclick="deleteKey()">Delete</button>

        <h3>Data</h3>
        <pre id="output"></pre>
    </div>
</div>

<script>
const USER = "imo";
const PASS = "tensaiclueless";

let db = JSON.parse(localStorage.getItem("keysDB")) || { keys: [] };

function save() {
    localStorage.setItem("keysDB", JSON.stringify(db));
    render();
}

function generateId() {
    return "key_" + Math.random().toString(36).substr(2, 9);
}

function login() {
    let u = document.getElementById("username").value;
    let p = document.getElementById("password").value;

    if (u === USER && p === PASS) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("panel").style.display = "block";
        render();
    } else {
        alert("Invalid login");
    }
}

function addKey() {
    let owner = document.getElementById("owner").value;
    let key = document.getElementById("key").value;
    let expires = document.getElementById("expires").value;
    let notes = document.getElementById("notes").value;

    if (!owner || !key) return alert("Missing fields");

    db.keys.push({
        id: generateId(),
        owner,
        key,
        created: new Date().toISOString(),
        expires: expires || null,
        revoked: false,
        notes: notes || ""
    });

    save();
}

function revokeKey() {
    let id = document.getElementById("manageId").value;
    let k = db.keys.find(x => x.id === id);
    if (k) {
        k.revoked = true;
        save();
    }
}

function deleteKey() {
    let id = document.getElementById("manageId").value;
    db.keys = db.keys.filter(x => x.id !== id);
    save();
}

function render() {
    document.getElementById("output").textContent =
        JSON.stringify(db, null, 2);
}

// simulate "hidden" page first
setTimeout(() => {
    document.getElementById("errorScreen").style.display = "none";
    document.getElementById("loginScreen").style.display = "block";
}, 800);
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Key Manager</title>
</head>

<body>

<h2>Login</h2>

<div id="login">
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none;">
    <h3>Add Key</h3>
    <input id="owner" placeholder="Owner">
    <input id="key" placeholder="Key">
    <input id="expires" type="datetime-local">
    <input id="notes" placeholder="Notes">
    <button onclick="addKey()">Add</button>

    <h3>Manage</h3>
    <input id="manageId" placeholder="Key ID">
    <button onclick="revokeKey()">Revoke</button>
    <button onclick="deleteKey()">Delete</button>

    <pre id="output"></pre>
</div>

<script>
const API = "https://hidden-wildflower-4db0.alexexum21.workers.dev";
let TOKEN = null;

const output = document.getElementById("output");
const owner = document.getElementById("owner");
const key = document.getElementById("key");
const expires = document.getElementById("expires");
const notes = document.getElementById("notes");
const manageId = document.getElementById("manageId");

// LOGIN
async function login() {
    let user = document.getElementById("user").value;
    let pass = document.getElementById("pass").value;

    let res = await fetch(API + "/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ user, pass })
    });

    if (!res.ok) return alert("login failed");

    let data = await res.json();
    TOKEN = data.token;

    document.getElementById("login").style.display = "none";
    document.getElementById("panel").style.display = "block";

    loadKeys();
}

// AUTH
function auth() {
    return {
        "Content-Type": "application/json",
        "Authorization": TOKEN
    };
}

// LOAD
async function loadKeys() {
    let res = await fetch(API + "/get", { headers: auth() });
    let data = await res.json();
    output.textContent = JSON.stringify(data, null, 2);
}

// ADD
async function addKey() {
    await fetch(API + "/add", {
        method: "POST",
        headers: auth(),
        body: JSON.stringify({
            owner: owner.value,
            key: key.value,
            expires: expires.value,
            notes: notes.value
        })
    });

    loadKeys();
}

// REVOKE
async function revokeKey() {
    await fetch(API + "/revoke", {
        method: "POST",
        headers: auth(),
        body: JSON.stringify({ id: manageId.value })
    });

    loadKeys();
}

// DELETE
async function deleteKey() {
    await fetch(API + "/delete", {
        method: "POST",
        headers: auth(),
        body: JSON.stringify({ id: manageId.value })
    });

    loadKeys();
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Key Manager</title>
</head>
<body>

<h2>Key Manager</h2>

<div>
    <h3>Add Key</h3>
    <input id="owner" placeholder="Owner Name"><br><br>
    <input id="key" placeholder="Key Value"><br><br>
    <input id="expires" type="datetime-local"><br><br>
    <input id="notes" placeholder="Notes"><br><br>
    <button onclick="addKey()">Add Key</button>
</div>

<hr>

<div>
    <h3>Manage Key</h3>
    <input id="manageId" placeholder="Key ID"><br><br>
    <button onclick="revokeKey()">Revoke</button>
    <button onclick="deleteKey()">Delete</button>
</div>

<hr>

<h3>Raw Data (for your program)</h3>
<pre id="output"></pre>

<script>
let db = JSON.parse(localStorage.getItem("keysDB")) || {
    keys: []
};

function save() {
    localStorage.setItem("keysDB", JSON.stringify(db));
    render();
}

function generateId() {
    return "key_" + Math.random().toString(36).substr(2, 9);
}

function addKey() {
    let owner = document.getElementById("owner").value;
    let key = document.getElementById("key").value;
    let expires = document.getElementById("expires").value;
    let notes = document.getElementById("notes").value;

    if (!owner || !key) {
        alert("Owner and key required");
        return;
    }

    db.keys.push({
        id: generateId(),
        owner: owner,
        key: key,
        created: new Date().toISOString(),
        expires: expires || null,
        revoked: false,
        notes: notes || ""
    });

    save();
}

function revokeKey() {
    let id = document.getElementById("manageId").value;
    let k = db.keys.find(x => x.id === id);
    if (k) {
        k.revoked = true;
        save();
    } else {
        alert("Key not found");
    }
}

function deleteKey() {
    let id = document.getElementById("manageId").value;
    db.keys = db.keys.filter(x => x.id !== id);
    save();
}

function render() {
    document.getElementById("output").textContent =
        JSON.stringify(db, null, 2);
}

render();
</script>

</body>
</html>

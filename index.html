<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Manager</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 30px;
    min-height: 100vh;
}

h2#status {
    text-align: center;
    margin-bottom: 20px;
    font-weight: 400;
    color: #f85149;
}

/* Card base */
.card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
}

/* Login */
#login {
    max-width: 420px;
    margin: 60px auto 0;
}
#login h3 {
    margin-bottom: 20px;
    font-size: 1.3rem;
    text-align: center;
}

/* Panel layout */
#panel {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    align-items: start;
}

/* Sidebar */
.sidebar {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.sidebar .card h3 {
    font-size: 1rem;
    margin-bottom: 16px;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

/* Inputs */
input, button {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #30363d;
    font-size: 0.95rem;
    transition: border-color 0.15s, box-shadow 0.15s;
}
input {
    background: #0d1117;
    color: #e6edf3;
    margin-bottom: 10px;
}
input:focus {
    outline: none;
    border-color: #58a6ff;
    box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
}
input::placeholder { color: #484f58; }

/* Buttons */
button {
    background: #238636;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: 500;
    margin: 0;
}
button:hover {
    background: #2ea043;
}
button.secondary {
    background: #21262d;
    border: 1px solid #30363d;
}
button.secondary:hover {
    background: #30363d;
}
button.danger {
    background: #da3633;
}
button.danger:hover {
    background: #f85149;
}

/* Manage buttons row */
.manage-btns {
    display: flex;
    gap: 10px;
}
.manage-btns button { flex: 1; }

/* Data area */
.data-card {
    min-height: 400px;
    display: flex;
    flex-direction: column;
}
.data-card h3 {
    font-size: 1rem;
    margin-bottom: 16px;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
pre {
    background: #0d1117;
    padding: 16px;
    border-radius: 8px;
    border: 1px solid #21262d;
    text-align: left;
    overflow-x: auto;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.85rem;
    line-height: 1.5;
    flex: 1;
    color: #c9d1d9;
}

/* Responsive */
@media (max-width: 800px) {
    #panel {
        grid-template-columns: 1fr;
    }
    body { padding: 16px; }
}
</style>
<base target="_blank">
</head>

<body>

<h2 id="status">Error: couldn't fetch</h2>

<div id="login" class="card" style="display:none;">
    <h3>Login</h3>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none;">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="card">
            <h3>Add Key</h3>
            <input id="owner" placeholder="Owner">
            <input id="key" placeholder="Key">
            <input id="expires" type="datetime-local">
            <input id="notes" placeholder="Notes">
            <button onclick="addKey()">Add Key</button>
        </div>

        <div class="card">
            <h3>Manage</h3>
            <input id="manageId" placeholder="Key ID">
            <div class="manage-btns">
                <button class="secondary" onclick="revokeKey()">Revoke</button>
                <button class="danger" onclick="deleteKey()">Delete</button>
            </div>
        </div>
    </div>

    <!-- Data -->
    <div class="card data-card">
        <h3>Data</h3>
        <pre id="output"></pre>
    </div>
</div>

<script>
// --------- SPLIT API (your name hidden in parts) ---------
const a = "https://hidden";
const b = "-wildflower";
const c = "-4db0";

const d1 = "ale";
const d2 = "xex";
const d3 = "um21";

const e1 = "work";
const e2 = "ers.dev";

const API = a + b + c + "." + d1 + d2 + d3 + "." + e1 + e2;

// --------- STATE ---------
let TOKEN = localStorage.getItem("token") || null;

// elements
const output = document.getElementById("output");
const owner = document.getElementById("owner");
const key = document.getElementById("key");
const expires = document.getElementById("expires");
const notes = document.getElementById("notes");
const manageId = document.getElementById("manageId");

// --------- AUTH ---------
function auth() {
    return {
        "Content-Type": "application/json",
        "Authorization": TOKEN
    };
}

// --------- LOGIN ---------
async function login() {
    let user = document.getElementById("user").value;
    let pass = document.getElementById("pass").value;

    let res = await fetch(API + "/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ user, pass })
    });

    if (!res.ok) return alert("login failed");

    let data = await res.json();
    TOKEN = data.token;
    localStorage.setItem("token", TOKEN);

    document.getElementById("login").style.display = "none";
    document.getElementById("panel").style.display = "grid";

    loadKeys();
}

// --------- LOAD ---------
async function loadKeys() {
    let res = await fetch(API + "/get", { headers: auth() });

    if (res.status === 401 || res.status === 403) {
        localStorage.removeItem("token");
        alert("Session expired");
        location.reload();
        return;
    }

    let data = await res.json();
    output.textContent = JSON.stringify(data, null, 2);
}

// --------- ACTIONS ---------
async function addKey() {
    let res = await fetch(API + "/add", {
        method: "POST",
        headers: auth(),
        body: JSON.stringify({
            owner: owner.value,
            key: key.value,
            expires: expires.value,
            notes: notes.value
        })
    });

    if (!res.ok) return alert("failed to add");

    owner.value = key.value = expires.value = notes.value = "";
    loadKeys();
}

async function revokeKey() {
    let res = await fetch(API + "/revoke", {
        method: "POST",
        headers: auth(),
        body: JSON.stringify({ id: manageId.value })
    });

    if (!res.ok) return alert("failed");

    loadKeys();
}

async function deleteKey() {
    let res = await fetch(API + "/delete", {
        method: "POST",
        headers: auth(),
        body: JSON.stringify({ id: manageId.value })
    });

    if (!res.ok) return alert("failed");

    loadKeys();
}

// --------- INITIAL SCREEN ---------
setTimeout(() => {
    document.getElementById("status").style.display = "none";

    if (TOKEN) {
        document.getElementById("panel").style.display = "grid";
        loadKeys();
    } else {
        document.getElementById("login").style.display = "block";
    }
}, 800);
</script>

</body>
</html>
